<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0E">
<meta name="color-scheme" content="dark">
<title>Explorer Share</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="drop-veil" id="dropVeil" hidden></div>
<input type="file" id="pickFiles" multiple hidden>
<input type="file" id="pickFolder" webkitdirectory multiple hidden>
<noscript><p style="padding:24px;color:#F1EFE9;font-family:system-ui">Explorer Share needs JavaScript.</p></noscript>
</body>
</html>
